<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>写真承認 | 青木研 OB・OG会</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#172a3a}
    form,.item{border:1px solid #dbe2df;border-radius:8px;padding:1rem;margin:1rem 0}
    input,button{font:inherit;padding:.6rem}button{cursor:pointer}img{display:block;max-width:100%;max-height:55vh;margin:1rem 0}
    .actions{display:flex;gap:.7rem}.error{color:#9c2f25}.muted{color:#5e6b73}
  </style>
</head>
<body>
  <main>
    <h1>写真の承認・公開</h1>
    <p class="muted">この画面は幹事用です。共有パスワードを入力してください。承認した写真は公開されます。</p>
    <form id="login">
      <label>幹事用パスワード <input id="password" type="password" autocomplete="current-password" required></label>
      <button>未承認写真を表示</button>
    </form>
    <button id="logout" type="button" hidden>ログアウト</button>
    <p id="status" role="status"></p>
    <section id="items"></section>
  </main>
  <script>
    let password = "";
    let imageUrls = [];
    const status = document.querySelector("#status");
    const items = document.querySelector("#items");
    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { ...options.headers, Authorization: `Bearer ${password}` }
      });
      const data = response.headers.get("content-type")?.includes("application/json") ? await response.json() : null;
      if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      return { response, data };
    }
    async function load() {
      const { data } = await request("/api/admin/pending");
      for (const imageUrl of imageUrls) URL.revokeObjectURL(imageUrl);
      imageUrls = [];
      items.replaceChildren();
      status.className = "";
      if (!data.photos.length) {
        status.textContent = "未承認の写真はありません。";
        return;
      }
      status.textContent = `${data.photos.length}件の未承認写真があります。`;
      for (const photo of data.photos) {
        const article = document.createElement("article");
        article.className = "item";
        const heading = document.createElement("h2");
        heading.textContent = photo.caption;
        const details = document.createElement("p");
        details.textContent = `${photo.name}・${photo.enrollmentYear}年入学・${photo.decade}`;
        const image = document.createElement("img");
        const { response } = await request(`/api/admin/pending/${encodeURIComponent(photo.id)}/image`);
        image.src = URL.createObjectURL(await response.blob());
        imageUrls.push(image.src);
        image.alt = photo.caption;
        const actions = document.createElement("div");
        actions.className = "actions";
        let approveButton;
        for (const [label, action, method] of [["承認して公開", "approve", "POST"], ["却下して削除", "delete", "DELETE"]]) {
          const button = document.createElement("button");
          button.textContent = label;
          if (action === "approve") {
            button.disabled = true;
            approveButton = button;
          }
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              await request(`/api/admin/pending/${encodeURIComponent(photo.id)}/${action}`, { method });
              await load();
            } catch (error) {
              status.textContent = error.message;
              status.className = "error";
              button.disabled = false;
            }
          });
          actions.append(button);
        }
        article.append(heading, details, image, actions);
        items.append(article);
        image.decode().then(() => {
          approveButton.disabled = false;
        }).catch(() => {
          status.textContent = "画像を表示できない投稿は承認できません。";
          status.className = "error";
        });
      }
    }
    document.querySelector("#login").addEventListener("submit", async (event) => {
      event.preventDefault();
      password = document.querySelector("#password").value;
      status.className = "";
      try {
        await load();
        document.querySelector("#password").value = "";
        document.querySelector("#logout").hidden = false;
      } catch (error) {
        password = "";
        status.textContent = error.message;
        status.className = "error";
      }
    });
    document.querySelector("#logout").addEventListener("click", () => {
      password = "";
      for (const imageUrl of imageUrls) URL.revokeObjectURL(imageUrl);
      imageUrls = [];
      items.replaceChildren();
      status.textContent = "ログアウトしました。";
      document.querySelector("#logout").hidden = true;
    });
  </script>
</body>
</html>
