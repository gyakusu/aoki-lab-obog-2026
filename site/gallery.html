<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>写真ギャラリー | 青木研 OB・OG会 2026</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">青木研 OB・OG会</a>
      <nav aria-label="メインナビゲーション">
        <a href="event.html">当日案内</a>
        <a aria-current="page" href="gallery.html">写真</a>
        <a href="upload.html">写真を投稿</a>
      </nav>
    </header>
    <main class="page">
      <p class="eyebrow">PHOTO GALLERY</p>
      <h1>写真ギャラリー</h1>
      <p>幹事が確認し、承認した写真を掲載しています。</p>
      <div class="filters">
        <label>年代
          <select id="decade-filter">
            <option value="">すべて</option>
          </select>
        </label>
        <label>入学年度
          <select id="year-filter">
            <option value="">すべて</option>
          </select>
        </label>
      </div>
      <div id="gallery" class="gallery-grid" aria-live="polite">
        <p class="muted">写真を読み込んでいます。</p>
      </div>
      <p class="hint">写真の削除依頼・お問い合わせは<a href="event.html">当日案内</a>に記載の連絡先までお願いします。</p>
    </main>
    <dialog id="photo-dialog" aria-label="写真の拡大表示">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="閉じる">×</button>
      <img id="dialog-image" alt="">
      <p id="dialog-caption"></p>
    </dialog>
    <footer>
      <p><a href="upload.html">写真を投稿する</a></p>
    </footer>
    <script type="module" src="js/gallery.js"></script>
  </body>
</html>
